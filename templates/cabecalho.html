<header class="topo">
<div class="topo-conteudo">

    <a href="{{ url_for('index') }}"
    class="topo-logo"
    aria-label="Ministério do Meio Ambiente - ir para o início">
        <img src="{{ url_for('static', filename='img/logo2.jpg') }}"
        alt="Ministério do Meio Ambiente">
    </a>

    {% if nexus %}
    <div class="topo-divisor" aria-hidden="true"></div>

    <div class="topo-nexus">
    <div class="nexus-icone" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none"
            stroke="currentColor" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8V6a2 2 0 0 1 2-2h2"/>
            <path d="M16 4h2a2 2 0 0 1 2 2v2"/>
            <path d="M20 16v2a2 2 0 0 1-2 2h-2"/>
            <path d="M8 20H6a2 2 0 0 1-2-2v-2"/>
            <path d="M9 10v1"/>
            <path d="M15 10v1"/>
            <path d="M12 10v3h-1"/>
            <path d="M9 16c1.7 1.3 4.3 1.3 6 0"/>
        </svg>
    </div>

        <div>
            <p class="nexus-sigla">NEXUS
            <p class="nexus-nome">
                Sistema de Identificação e Autenticação Biométrica
            </p>
        </div>
        </div>
    {% endif %}

    </div>
</header>
