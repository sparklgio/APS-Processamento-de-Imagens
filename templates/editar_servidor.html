<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Servidor | NEXUS</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    {% include "cabecalho.html" %}

    <main>
        <section class="card">

            {% with mensagens = get_flashed_messages() %}
                {% for mensagem in mensagens %}
                    <p role="status">{{ mensagem }}</p>
                {% endfor %}
            {% endwith %}

            <h2>Dados do servidor</h2>

            <form method="POST" class="form-edicao">

                <label for="nome">Nome completo</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    value="{{ servidor['nome'] }}"
                    required
                >

                <label for="cargo">Cargo</label>
                <input
                    type="text"
                    id="cargo"
                    name="cargo"
                    value="{{ servidor['cargo'] }}"
                    required
                >

                <label for="departamento">Departamento</label>
                <input
                    type="text"
                    id="departamento"
                    name="departamento"
                    value="{{ servidor['departamento'] }}"
                    required
                >

                <label for="nivel_permissao">Nível de permissão</label>
                <select id="nivel_permissao" name="nivel_permissao" required>
                    <option value="1" {% if servidor['nivel_permissao'] == 1 %}selected{% endif %}>
                        Nível 1 - Acesso geral
                    </option>

                    <option value="2" {% if servidor['nivel_permissao'] == 2 %}selected{% endif %}>
                        Nível 2 - Diretores autorizados
                    </option>

                    <option value="3" {% if servidor['nivel_permissao'] == 3 %}selected{% endif %}>
                        Nível 3 - Ministro
                    </option>
                </select>

                <button type="submit">Salvar alterações</button>

            </form>

            <div class="nav-botoes">
                <a href="{{ url_for('gerenciamento_servidores') }}" class="btn-voltar">
                    ← Voltar à lista de servidores
                </a>
            </div>

        </section>
    </main>

</body>
</html>
