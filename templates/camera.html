<ol class="passos" aria-label="Etapas da identificação">
    <li class="passo"><span>1</span>Ativar câmera</li>
    <li class="passo"><span>2</span>Capturar rosto</li>
    <li class="passo"><span>3</span>{{ rotulo_final }}</li>
    </ol>

    <div class="camera-frame" id="cameraFrame">
        <div class="camera-vazia">
            <svg viewBox="0 0 24 24" width="44" height="44" fill="none"
                stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 8h3l2-3h6l2 3h3v11H4z"/>
                <circle cx="12" cy="13" r="3.5"/>
            </svg>
            <span>Câmera desligada</span>
        </div>
        <video id="webcam" autoplay playsinline></video>
        <div class="mira" aria-hidden="true"></div>
    </div>
    <canvas id="snapshot" hidden></canvas>

    <div class="botoes-camera">
        <button type="button" id="btnCamera" class="btn-secundario">Ativar câmera</button>
        <button type="button" id="btnCapturar" class="btn-secundario" disabled>Capturar rosto</button>
    </div>

    <p id="statusCamera" class="status" role="status">
        A câmera ainda não foi ativada.
    </p>

    <input type="hidden" id="imagem" name="imagem">
